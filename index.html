:root{font-family:system-ui,'Noto Sans Malayalam',sans-serif;background:#f1f5f9;color:#172b40}*{box-sizing:border-box}body{margin:0}header{background:#102c45;color:white;padding:16px}header strong{font-size:19px}header small{display:block;color:#b7d1e1;margin-top:5px}.wrap{max-width:840px;margin:auto;padding:14px}.card{background:white;padding:18px;border-radius:15px;margin-bottom:14px;box-shadow:0 2px 12px #102c4510}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:12px 0}button,select{font:inherit}button{background:#12658d;color:white;border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:650;margin:3px 3px 3px 0}button.secondary{background:#e8f0f5;color:#1d4861}button:disabled{opacity:.45}select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin:6px 0 12px;background:white}.muted{font-size:13px;color:#627588}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.tabs button.active{background:#102c45}.opt{display:block;width:100%;text-align:left;padding:13px;background:#edf4f8;color:#193b50;margin:6px 0;border:2px solid transparent}.opt.selected{border-color:#12658d;background:#d7eaf6}.opt.good{border-color:#2a9d67}.opt.bad{border-color:#cb5555}.tag{font-size:12px;background:#e9f0f5;padding:4px 8px;border-radius:20px;display:inline-block;margin:3px 5px 3px 0}.notice{background:#fff8e5;padding:12px;border-radius:9px;font-size:13px}.line{border-top:1px solid #e5ebef;margin:14px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.stat{background:#eaf1f6;border-radius:9px;padding:12px}.hidden{display:none}pre{white-space:pre-wrap}.exp{background:#f4f8fb;border-radius:9px;padding:12px;line-height:1.7}label{font-size:14px;font-weight:650}#question{line-height:1.6}footer{text-align:center;color:#687b8a;font-size:12px;padding:12px}</style></head><body><header><strong>Mission Kerala PSC</strong><small>Assistant Professor Mechanical • Cat. 727/2021 • Updated Practice</small></header><main class="wrap"><div class="tabs"><button id="tabTopic" onclick="screen('topic')">Topic-wise Practice</button><button id="tabWeekly" onclick="screen('weekly')">Weekly Mocks</button><button id="tabHistory" onclick="screen('history')">History</button></div><div id="home" class="card"></div><div id="test" class="card hidden"></div><div id="results" class="card hidden"></div></main><footer>200 existing questions • Offline HTML • Local device history • 200 existing questions • subject-wise mapping • explanations and PSC quick methods</footer><script>const DATA={"modules":[{"name":"Engineering Mathematics","topics":["Matrices","Partial Differentiation & Multiple Integrals","Ordinary Differential Equations","Vector Calculus","Complex Analysis","Fourier Series","Probability & Statistics","Numerical Methods"],"marks":10},{"name":"Fluid Mechanics and Hydraulic Machines","topics":["Fluid Properties & Statics","Fluid Kinematics & Dynamics","Viscous & Pipe Flow","Boundary Layer","Compressible Flow","Hydraulic Turbines","Pumps","Dimensional Analysis & Similarity","Open Channel Flow"],"marks":15},{"name":"Thermodynamics and Heat Transfer","topics":["Thermodynamic Fundamentals","Second Law & Entropy","Properties & Relations","Conduction","Convection & Heat Exchangers","Radiation & Mass Transfer","Steam Turbines & Nozzles","Gas Turbines","IC Engines","Refrigeration & Psychrometry"],"marks":15},{"name":"Applied Mechanics and Theory of Machines","topics":["Statics & Dynamics","Mechanisms","Cams & Gears","Flywheel, Gyroscope & Balancing","Vibrations","Belts & Pressure Vessels"],"marks":15},{"name":"Mechanics of Solids and Machine Design","topics":["Stress, Strain & Beams","Material Properties & Failure","Joints & Springs","Shafts, Clutches & Brakes","Gears & Bearings","Belts & Pressure Vessels"],"marks":15},{"name":"Manufacturing Technology","topics":["Engineering Materials & Heat Treatment","Casting & Forming","Welding & Joining","Machine Tools & Finishing","Metrology","Advanced Manufacturing & CNC"],"marks":15},{"name":"Industrial Engineering and Management","topics":["Management & Organisations","Plant Layout & Forecasting","PPC & Inventory","Work Study & Quality","Operations Research","Network, Decision & Game Theory","Material Handling & Economics"],"marks":15}],"sets":[{"id":"2026-11-01","title":"First 100 MCQs – 01 Nov 2026","questions":[{"n":1,"question":"Eigenvalues of A are 1, -2 and 4. Find det(A^2).","options":{"A":"-8","B":"64","C":"8","D":"16"},"answer":"B","explanation":"det(A^2)=[det(A)]^2=[1(-2)(4)]^2=64.","difficulty":"Easy","module":"Engineering Mathematics","topic":"Matrices","uid":"2026-11-01-1"},{"n":2,"question":"Find the trace of A^2 if eigenvalues of A are -1, 2 and 3.","options":{"A":"14","B":"4","C":"6","D":"12"},"answer":"A","explanation":"trace(A^2)=sum of squares of eigenvalues=1+4+9=14.","difficulty":"Easy","module":"Engineering Mathematics","topic":"Matrices","uid":"2026-11-01-2"},{"n":3,"question":"The integrating factor of dy/dx + (2/x)y = x, x>0, is","options":{"A":"1/x^2","B":"x^2","C":"x","D":"e^(2x)"},"answer":"B","explanation":"For dy/dx+P(x)y=Q(x), IF=exp(integral P dx)=exp(2 ln x)=x^2.","difficulty":"Difficult","module":"Engineering Mathematics","topic":"Ordinary Differential Equations","uid":"2026-11-01-3"},{"n":4,"question":"For f(x,y)=x^2+xy+y^2, the Hessian determinant is","options":{"A":"4","B":"0","C":"3","D":"2"},"answer":"C","explanation":"f_xx=2, f_yy=2, f_xy=1. Hessian determinant=2(2)-1^2=3.","difficulty":"Difficult","module":"Engineering Mathematics","topic":"Partial Differentiation & Multiple Integrals","uid":"2026-11-01-4"},{"n":5,"question":"The Laplace transform of t e^(-2t) is","options":{"A":"1/(s+2)","B":"2/(s+2)^3","C":"1/(s-2)^2","D":"1/(s+2)^2"},"answer":"D","explanation":"L{t}=1/s^2. First shifting theorem gives L{t e^(-2t)}=1/(s+2)^2.","difficulty":"Moderate","module":"Engineering Mathematics","topic":"Ordinary Differential Equations","uid":"2026-11-01-5"},{"n":6,"question":"For a Poisson random variable with mean 3, the variance is","options":{"A":"1/3","B":"9","C":"sqrt(3)","D":"3"},"answer":"D","explanation":"For Poisson(lambda), mean=lambda and variance=lambda=3.","difficulty":"Easy","module":"Engineering Mathematics","topic":"Probability & Statistics","uid":"2026-11-01-6"},{"n":7,"question":"Newton-Raphson iteration for root of x^2-5=0 starting at x0=2 gives x1 =","options":{"A":"2","B":"11/4","C":"9/4","D":"5/2"},"answer":"C","explanation":"x1=x0-f(x0)/f'(x0)=2-(-1)/4=9/4.","difficulty":"Moderate","module":"Engineering Mathematics","topic":"Numerical Methods","uid":"2026-11-01-7"},{"n":8,"question":"The residue of f(z)=z/(z-2) at z=2 is","options":{"A":"4","B":"2","C":"1","D":"0"},"answer":"B","explanation":"Simple pole: residue=lim(z->2)(z-2)f(z)=2.","difficulty":"Difficult","module":"Engineering Mathematics","topic":"Complex Analysis","uid":"2026-11-01-8"},{"n":9,"question":"If a 3x3 matrix has rank 2, its determinant is","options":{"A":"0","B":"2","C":"1","D":"Cannot be determined"},"answer":"A","explanation":"A square matrix is singular when rank<n; hence determinant zero.","difficulty":"Easy","module":"Engineering Mathematics","topic":"Matrices","uid":"2026-11-01-9"},{"n":10,"question":"For the vector field F=(x,y,z), divergence of F is","options":{"A":"1","B":"0","C":"x+y+z","D":"3"},"answer":"D","explanation":"div F=d(x)/dx+d(y)/dy+d(z)/dz=1+1+1=3.","difficulty":"Moderate","module":"Engineering Mathematics","topic":"Vector Calculus","uid":"2026-11-01-10"},{"n":11,"question":"Dimensions of kinematic viscosity are","options":{"A":"L^2 T^-1","B":"M L^-3","C":"L T^-1","D":"M L^-1 T^-1"},"answer":"A","explanation":"nu=mu/rho; (M L^-1 T^-1)/(M L^-3)=L^2 T^-1.","difficulty":"Easy","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Properties & Statics","uid":"2026-11-01-11"},{"n":12,"question":"In a 2D velocity field u=2xy and v=-x^2, the z-vorticity is","options":{"A":"-2x","B":"4x","C":"0","D":"-4x"},"answer":"D","explanation":"omega_z=dv/dx-du/dy=-2x-2x=-4x.","difficulty":"Difficult","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Kinematics & Dynamics","uid":"2026-11-01-12"},{"n":13,"question":"Water enters a pipe of diameter 100 mm at 2 m/s. If diameter falls to 50 mm, outlet velocity is","options":{"A":"4 m/s","B":"16 m/s","C":"8 m/s","D":"2 m/s"},"answer":"C","explanation":"Continuity: V2=V1(D1/D2)^2=2(2)^2=8 m/s.","difficulty":"Easy","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-01-13"},{"n":14,"question":"For ideal flow in a horizontal converging duct, increasing speed causes static pressure to","options":{"A":"Increase","B":"Become zero","C":"Remain constant","D":"Decrease"},"answer":"D","explanation":"Bernoulli: p+rho V^2/2=constant at same elevation; larger V gives smaller p.","difficulty":"Easy","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Kinematics & Dynamics","uid":"2026-11-01-14"},{"n":15,"question":"Reynolds number for a pipe flow is given by","options":{"A":"rho V D / mu","B":"V D mu/rho","C":"mu/(rho V D)","D":"rho V^2 D/mu"},"answer":"A","explanation":"Ratio of inertial to viscous forces: Re=rho V D/mu=VD/nu.","difficulty":"Moderate","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-01-15"},{"n":16,"question":"For a laminar flat-plate boundary layer, if free-stream velocity is quadrupled at fixed x and nu, delta becomes","options":{"A":"Half","B":"Four times","C":"Twice","D":"Unchanged"},"answer":"A","explanation":"delta approx 5x/sqrt(Re_x), Re_x proportional to U; quadrupling U halves delta.","difficulty":"Easy","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-01-16"},{"n":17,"question":"The Darcy friction factor for fully developed laminar flow in a circular pipe is","options":{"A":"Re/64","B":"0.079/Re^0.25","C":"64/Re","D":"16/Re"},"answer":"C","explanation":"Hagen-Poiseuille result in Darcy convention: f_D=64/Re. Fanning factor is 16/Re.","difficulty":"Difficult","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-01-17"},{"n":18,"question":"For laminar flow in a circular pipe, the maximum velocity divided by mean velocity equals","options":{"A":"1","B":"1.5","C":"2","D":"4"},"answer":"C","explanation":"Parabolic profile u(r)=u_max[1-(r/R)^2]; integration gives u_mean=u_max/2.","difficulty":"Easy","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-01-18"},{"n":19,"question":"Hydraulic radius of a full circular pipe of diameter D is","options":{"A":"D/4","B":"D/2","C":"4D","D":"D"},"answer":"A","explanation":"Hydraulic radius=A/wetted perimeter=(pi D^2/4)/(pi D)=D/4.","difficulty":"Difficult","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-01-19"},{"n":20,"question":"A Pitot-static tube measures local flow velocity from","options":{"A":"Elevation difference only","B":"Stagnation minus static pressure","C":"Viscous shear stress","D":"Static pressure only"},"answer":"B","explanation":"For incompressible inviscid flow, p0-p=rho V^2/2, so V=sqrt[2(p0-p)/rho].","difficulty":"Easy","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Kinematics & Dynamics","uid":"2026-11-01-20"},{"n":21,"question":"Specific speed of a centrifugal pump is proportional to","options":{"A":"N sqrt(Q) / H^(3/4)","B":"N H^(3/4)/sqrt(Q)","C":"N Q / H","D":"sqrt(NQH)"},"answer":"A","explanation":"Pump specific speed Ns=N sqrt(Q)/H^(3/4) in conventional dimensional units.","difficulty":"Difficult","module":"Fluid Mechanics and Hydraulic Machines","topic":"Pumps","uid":"2026-11-01-21"},{"n":22,"question":"For a geometrically similar centrifugal pump at fixed diameter, doubling speed changes ideal discharge to","options":{"A":"4Q","B":"8Q","C":"Q/2","D":"2Q"},"answer":"D","explanation":"Pump affinity laws: Q proportional to N D^3, so at fixed D, Q2/Q1=N2/N1=2. Kerala PSC AP Mechanical | Original practice mock | 01 Nov 2026 Page 2","difficulty":"Moderate","module":"Fluid Mechanics and Hydraulic Machines","topic":"Pumps","uid":"2026-11-01-22"},{"n":23,"question":"A turbine develops 800 kW from 1 MW hydraulic input. Its overall efficiency is","options":{"A":"80%","B":"85%","C":"125%","D":"75%"},"answer":"A","explanation":"Overall efficiency=shaft output/hydraulic input=800/1000=0.80.","difficulty":"Moderate","module":"Fluid Mechanics and Hydraulic Machines","topic":"Hydraulic Turbines","uid":"2026-11-01-23"},{"n":24,"question":"A Pelton wheel is primarily a","options":{"A":"Low-head reaction turbine","B":"Axial-flow reaction turbine","C":"Mixed-flow pump","D":"High-head impulse turbine"},"answer":"D","explanation":"Pelton converts jet kinetic energy into runner work at approximately atmospheric runner pressure.","difficulty":"Difficult","module":"Fluid Mechanics and Hydraulic Machines","topic":"Hydraulic Turbines","uid":"2026-11-01-24"},{"n":25,"question":"For a Francis turbine, the degree of reaction is generally","options":{"A":"Between 0 and 1","B":"Exactly 0","C":"Negative always","D":"Greater than 1 always"},"answer":"A","explanation":"Francis is a reaction turbine; pressure drop occurs through runner, unlike ideal impulse turbines. III. Thermodynamics and Heat Transfer","difficulty":"Moderate","module":"Fluid Mechanics and Hydraulic Machines","topic":"Hydraulic Turbines","uid":"2026-11-01-25"},{"n":26,"question":"For an ideal gas, internal energy depends only on","options":{"A":"Entropy only","B":"Pressure only","C":"Volume only","D":"Temperature"},"answer":"D","explanation":"Ideal-gas u=u(T); du=cv dT.","difficulty":"Easy","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-01-26"},{"n":27,"question":"A reversible heat engine operates between 600 K and 300 K. Maximum thermal efficiency is","options":{"A":"25%","B":"50%","C":"100%","D":"75%"},"answer":"B","explanation":"Carnot efficiency=1-Tc/Th=1-300/600=0.5.","difficulty":"Easy","module":"Thermodynamics and Heat Transfer","topic":"IC Engines","uid":"2026-11-01-27"},{"n":28,"question":"For a closed system, 100 kJ heat enters and 40 kJ work is done by system. Change in internal energy is","options":{"A":"60 kJ","B":"140 kJ","C":"-140 kJ","D":"-60 kJ"},"answer":"A","explanation":"First law delta U=Q-W=100-40=60 kJ.","difficulty":"Difficult","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-01-28"},{"n":29,"question":"For a reversible adiabatic process of an ideal gas, the relation is","options":{"A":"p/T = constant","B":"p V^gamma = constant","C":"p V = constant","D":"T V = constant"},"answer":"B","explanation":"For constant specific heats, reversible adiabatic (isentropic) ideal-gas process obeys pV^gamma=constant.","difficulty":"Easy","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-01-29"},{"n":30,"question":"A refrigerator removes 300 kJ while consuming 100 kJ work. COP is","options":{"A":"2","B":"1/3","C":"4","D":"3"},"answer":"D","explanation":"COP_R=Q_L/W=300/100=3.","difficulty":"Moderate","module":"Thermodynamics and Heat Transfer","topic":"Refrigeration & Psychrometry","uid":"2026-11-01-30"},{"n":31,"question":"For an ideal Otto cycle, increasing compression ratio at fixed gamma causes efficiency to","options":{"A":"Increase","B":"Remain constant","C":"Become negative","D":"Decrease"},"answer":"A","explanation":"eta_Otto=1-1/r^(gamma-1); larger r increases efficiency.","difficulty":"Difficult","module":"Thermodynamics and Heat Transfer","topic":"IC Engines","uid":"2026-11-01-31"},{"n":32,"question":"A throttling valve operating steadily with negligible kinetic and potential energy changes is approximately","options":{"A":"Isentropic","B":"Isothermal","C":"Isochoric","D":"Isenthalpic"},"answer":"D","explanation":"Steady-flow energy equation with q=w=0 gives h1=h2; entropy usually increases.","difficulty":"Moderate","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-01-32"},{"n":33,"question":"The critical radius of insulation for a cylinder is","options":{"A":"k/h","B":"sqrt(k/h)","C":"2k/h","D":"h/k"},"answer":"A","explanation":"For cylinder r_cr=k/h; for sphere r_cr=2k/h.","difficulty":"Moderate","module":"Thermodynamics and Heat Transfer","topic":"Conduction","uid":"2026-11-01-33"},{"n":34,"question":"A plane wall has thickness 0.1 m, area 2 m^2, conductivity 0.5 W/(m K), and 20 K temperature difference. Heat flow is","options":{"A":"400 W","B":"200 W","C":"20 W","D":"100 W"},"answer":"B","explanation":"Fourier conduction Qdot=k A DeltaT/L=0.5(2)(20)/0.1=200 W. Kerala PSC AP Mechanical | Original practice mock | 01 Nov 2026 Page 3","difficulty":"Difficult","module":"Thermodynamics and Heat Transfer","topic":"Conduction","uid":"2026-11-01-34"},{"n":35,"question":"The Biot number is defined as","options":{"A":"rho V Lc/mu","B":"h Lc / k","C":"h k/Lc","D":"k/(h Lc)"},"answer":"B","explanation":"Bi=h Lc/k_s; compares internal conduction resistance with external convection resistance.","difficulty":"Moderate","module":"Thermodynamics and Heat Transfer","topic":"Conduction","uid":"2026-11-01-35"},{"n":36,"question":"For a black surface, emissivity equals","options":{"A":"0.5","B":"Infinity","C":"1","D":"0"},"answer":"C","explanation":"A blackbody absorbs all incident radiation and has epsilon=1.","difficulty":"Moderate","module":"Thermodynamics and Heat Transfer","topic":"Radiation & Mass Transfer","uid":"2026-11-01-36"},{"n":37,"question":"For radiation between black surfaces, doubling absolute temperature of one surface alone multiplies its emitted power by","options":{"A":"2","B":"4","C":"16","D":"8"},"answer":"C","explanation":"Stefan-Boltzmann emission E_b=sigma T^4; (2T)^4/T^4=16.","difficulty":"Difficult","module":"Thermodynamics and Heat Transfer","topic":"Radiation & Mass Transfer","uid":"2026-11-01-37"},{"n":38,"question":"LMTD for a heat exchanger with terminal temperature differences 40 K and 20 K is","options":{"A":"60 K","B":"10/ln(2) K","C":"20/ln(2) K","D":"30 K"},"answer":"C","explanation":"DeltaT_lm=(40-20)/ln(40/20)=20/ln 2 K.","difficulty":"Moderate","module":"Thermodynamics and Heat Transfer","topic":"Convection & Heat Exchangers","uid":"2026-11-01-38"},{"n":39,"question":"In a counterflow heat exchanger, the maximum possible effectiveness is","options":{"A":"0","B":"Negative","C":"2","D":"1"},"answer":"D","explanation":"Effectiveness=actual heat transfer/maximum possible, bounded by 0 and 1.","difficulty":"Difficult","module":"Thermodynamics and Heat Transfer","topic":"Convection & Heat Exchangers","uid":"2026-11-01-39"},{"n":40,"question":"For a fin with an insulated tip, increasing fin length indefinitely makes fin efficiency generally","options":{"A":"Decrease","B":"Become negative","C":"Remain 1","D":"Increase to 1"},"answer":"A","explanation":"Fin efficiency=Q_actual/(h A_fin theta_base); longer fin adds cooler surface, reducing average efficiency. IV. Applied Mechanics and Theory of Machines","difficulty":"Moderate","module":"Thermodynamics and Heat Transfer","topic":"Conduction","uid":"2026-11-01-40"},{"n":41,"question":"A particle moves with constant speed along a circle of radius r. Its normal acceleration is","options":{"A":"vr","B":"v/r","C":"v^2/r","D":"0"},"answer":"C","explanation":"Centripetal acceleration a_n=v^2/r toward center.","difficulty":"Easy","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-01-41"},{"n":42,"question":"A 10 kg block rests on a horizontal surface with coefficient of static friction 0.3. Taking g=10 m/s^2, limiting friction is","options":{"A":"100 N","B":"3 N","C":"300 N","D":"30 N"},"answer":"D","explanation":"F_lim=mu_s N=0.3(10)(10)=30 N.","difficulty":"Easy","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-01-42"},{"n":43,"question":"A simply supported beam with a central point load P has equal reactions of","options":{"A":"Zero","B":"P/4 each","C":"P/2 each","D":"P each"},"answer":"C","explanation":"Symmetry and equilibrium: RA+RB=P, RA=RB=P/2.","difficulty":"Easy","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-01-43"},{"n":44,"question":"For a planar four-bar chain, Grashof criterion for at least one full-revolution link is","options":{"A":"s p = l q","B":"s+l <= p+q","C":"All links equal only","D":"s+l > p+q"},"answer":"B","explanation":"Grashof condition: sum of shortest and longest <= sum of remaining two.","difficulty":"Moderate","module":"Applied Mechanics and Theory of Machines","topic":"Mechanisms","uid":"2026-11-01-44"},{"n":45,"question":"A 20-tooth pinion drives a 60-tooth gear externally at 900 rpm. Gear speed magnitude is","options":{"A":"600 rpm","B":"300 rpm","C":"900 rpm","D":"2700 rpm"},"answer":"B","explanation":"N1 Z1=N2 Z2; N2=900(20/60)=300 rpm; external gears rotate oppositely.","difficulty":"Moderate","module":"Applied Mechanics and Theory of Machines","topic":"Cams & Gears","uid":"2026-11-01-45"},{"n":46,"question":"For an involute gear, the line of action is","options":{"A":"Common tangent to pitch circles only","B":"Common tangent to base circles","C":"A cycloidal curve","D":"Normal to gear axes"},"answer":"B","explanation":"Involute tooth contact normal is the common tangent to both base circles. Kerala PSC AP Mechanical | Original practice mock | 01 Nov 2026 Page 4","difficulty":"Difficult","module":"Applied Mechanics and Theory of Machines","topic":"Cams & Gears","uid":"2026-11-01-46"},{"n":47,"question":"In a simple harmonic cam follower motion, acceleration is maximum in magnitude at","options":{"A":"Ends of stroke","B":"All points equal","C":"Mid-stroke only","D":"Quarter-stroke only"},"answer":"A","explanation":"SHM displacement s=h/2[1-cos(pi theta/beta)]; acceleration proportional to cos(pi theta/beta), largest magnitude at endpoints.","difficulty":"Moderate","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-01-47"},{"n":48,"question":"For a single-degree-of-freedom undamped system, natural angular frequency is","options":{"A":"sqrt(m/k)","B":"k/m","C":"sqrt(k/m)","D":"2 pi sqrt(m/k)"},"answer":"C","explanation":"Equation m xddot+kx=0 gives omega_n=sqrt(k/m).","difficulty":"Difficult","module":"Applied Mechanics and Theory of Machines","topic":"Vibrations","uid":"2026-11-01-48"},{"n":49,"question":"At resonance in an undamped forced oscillator, the theoretical steady-state amplitude is","options":{"A":"Unbounded","B":"Equal to static deflection","C":"Always 1 mm","D":"Zero"},"answer":"A","explanation":"At excitation frequency equal to omega_n, ideal zero-damping response grows without bound.","difficulty":"Moderate","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-01-49"},{"n":50,"question":"The gyroscopic couple magnitude is","options":{"A":"m g r","B":"I omega omega_p","C":"I omega/omega_p","D":"I omega^2"},"answer":"B","explanation":"C=I omega omega_p for spin angular speed omega and precession omega_p.","difficulty":"Moderate","module":"Applied Mechanics and Theory of Machines","topic":"Flywheel, Gyroscope & Balancing","uid":"2026-11-01-50"},{"n":51,"question":"A flywheel mainly reduces","options":{"A":"Mean engine torque","B":"Cyclic fluctuation of speed","C":"Mean angular speed to zero","D":"Total work output"},"answer":"B","explanation":"Flywheel stores/releases kinetic energy over a cycle to reduce speed fluctuation.","difficulty":"Difficult","module":"Applied Mechanics and Theory of Machines","topic":"Flywheel, Gyroscope & Balancing","uid":"2026-11-01-51"},{"n":52,"question":"For a slider-crank mechanism, the ratio connecting-rod length to crank radius is commonly denoted by","options":{"A":"n = l+r","B":"n = r/l","C":"n = lr","D":"n = l/r"},"answer":"D","explanation":"Standard ratio n=l/r is used in approximate piston acceleration expression.","difficulty":"Moderate","module":"Applied Mechanics and Theory of Machines","topic":"Mechanisms","uid":"2026-11-01-52"},{"n":53,"question":"In a belt drive without slip, velocity ratio N2/N1 is","options":{"A":"1 always","B":"D2/D1","C":"D1 D2","D":"D1/D2"},"answer":"D","explanation":"Equal belt speeds: pi D1 N1=pi D2 N2, hence N2/N1=D1/D2.","difficulty":"Moderate","module":"Applied Mechanics and Theory of Machines","topic":"Belts & Pressure Vessels","uid":"2026-11-01-53"},{"n":54,"question":"The Coriolis acceleration magnitude in a rotating link is","options":{"A":"omega^2 r","B":"2 omega v_rel","C":"v_rel^2/r","D":"omega v_rel"},"answer":"B","explanation":"For a slider moving relative to rotating link, a_C=2 omega x v_rel in magnitude.","difficulty":"Difficult","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-01-54"},{"n":55,"question":"In static balancing of rotating masses in one plane, vector sum of","options":{"A":"Masses must be equal","B":"m r must be zero","C":"Angular velocities must be zero","D":"m r^2 must be zero"},"answer":"B","explanation":"Resultant centrifugal force proportional to omega^2 sum(m r vectors); static balance requires vector sum m r=0. V. Mechanics of Solids and Machine Design","difficulty":"Moderate","module":"Applied Mechanics and Theory of Machines","topic":"Flywheel, Gyroscope & Balancing","uid":"2026-11-01-55"},{"n":56,"question":"For an isotropic linearly elastic material, E, G and Poisson ratio nu satisfy","options":{"A":"E=2G(1-nu)","B":"E=3G(1-2nu)","C":"E=G(1+nu)","D":"E=2G(1+nu)"},"answer":"D","explanation":"Standard isotropic elasticity relation E=2G(1+nu).","difficulty":"Easy","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-01-56"},{"n":57,"question":"A bar 2 m long extends by 1 mm under axial tension. Engineering strain is","options":{"A":"0.005","B":"0.0005","C":"0.05","D":"0.5"},"answer":"B","explanation":"epsilon=delta L/L=0.001/2=0.0005.","difficulty":"Difficult","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-01-57"},{"n":58,"question":"Maximum shear stress in a solid circular shaft of diameter d under torque T is","options":{"A":"32T/(pi d^3)","B":"T/(pi d^2)","C":"8T/(pi d^3)","D":"16T/(pi d^3)"},"answer":"D","explanation":"T/J=tau_max/R, J=pi d^4/32, R=d/2 => tau_max=16T/(pi d^3). Kerala PSC AP Mechanical | Original practice mock | 01 Nov 2026 Page 5","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Shafts, Clutches & Brakes","uid":"2026-11-01-58"},{"n":59,"question":"The maximum bending moment for a simply supported beam of span L under UDL w per unit length is","options":{"A":"wL^2/2","B":"wL^2/12","C":"wL^2/8","D":"wL/2"},"answer":"C","explanation":"At midspan Mmax=wL^2/8 from symmetry and shear zero.","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-01-59"},{"n":60,"question":"Euler critical load for a pin-ended slender column is","options":{"A":"EI/L","B":"4pi^2 EI/L^2","C":"pi^2 EI/(4L^2)","D":"pi^2 EI/L^2"},"answer":"D","explanation":"Pcr=pi^2 EI/(Le)^2, Le=L for pinned-pinned.","difficulty":"Difficult","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-01-60"},{"n":61,"question":"For a thin cylindrical pressure vessel, hoop stress is","options":{"A":"p t/d","B":"2pt/d","C":"p d/(4t)","D":"p d/(2t)"},"answer":"D","explanation":"Longitudinal cut force balance gives sigma_hoop=p d/(2t).","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Belts & Pressure Vessels","uid":"2026-11-01-61"},{"n":62,"question":"Principal stresses at a point are 80 MPa and 20 MPa (plane stress). Maximum in-plane shear stress is","options":{"A":"60 MPa","B":"30 MPa","C":"50 MPa","D":"100 MPa"},"answer":"B","explanation":"Mohr circle radius=(sigma1-sigma2)/2=(80-20)/2=30 MPa.","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-01-62"},{"n":63,"question":"For pure bending of a prismatic beam, bending stress varies","options":{"A":"Quadratically with depth","B":"Uniformly over depth","C":"Linearly with distance from neutral axis","D":"Inversely with distance"},"answer":"C","explanation":"Flexure formula sigma=My/I: linear in y, zero at neutral axis.","difficulty":"Difficult","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-01-63"},{"n":64,"question":"In fatigue design, the Goodman relation combines alternating stress with","options":{"A":"Ultimate tensile strength","B":"Yield strength only","C":"Elastic modulus","D":"Poisson ratio"},"answer":"A","explanation":"Modified Goodman: sigma_a/Se+sigma_m/Sut=1 at limiting condition.","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Material Properties & Failure","uid":"2026-11-01-64"},{"n":65,"question":"A shaft transmits 10 kW at 1000 rpm. Approximate torque is","options":{"A":"9.55 N m","B":"955 N m","C":"95.5 N m","D":"100 N m exactly"},"answer":"C","explanation":"T=9550 P(kW)/N(rpm)=9550(10)/1000=95.5 N m.","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Shafts, Clutches & Brakes","uid":"2026-11-01-65"},{"n":66,"question":"For a square-thread power screw, self-locking occurs when","options":{"A":"Friction coefficient is zero","B":"Helix angle exceeds friction angle","C":"Lead is infinite","D":"Friction angle exceeds helix angle"},"answer":"D","explanation":"Self-locking if phi>lambda, equivalently mu>tan(lambda), ignoring collar friction.","difficulty":"Difficult","module":"Mechanics of Solids and Machine Design","topic":"Joints & Springs","uid":"2026-11-01-66"},{"n":67,"question":"In a preloaded bolted joint, the stiffness ratio C is","options":{"A":"km/(kb+km)","B":"kb/km","C":"kb+km","D":"kb/(kb+km)"},"answer":"D","explanation":"Fraction of external separating load taken by bolt C=kb/(kb+km).","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Joints & Springs","uid":"2026-11-01-67"},{"n":68,"question":"The Lewis equation in gear design estimates","options":{"A":"Bearing friction","B":"Bending strength of gear tooth","C":"Oil film thickness","D":"Surface pitting life only"},"answer":"B","explanation":"Lewis beam theory models tooth as cantilever and estimates bending stress/capacity.","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Gears & Bearings","uid":"2026-11-01-68"},{"n":69,"question":"For a rolling-element bearing, basic rating life L10 in million revolutions is","options":{"A":"(C/P)^p","B":"C/P","C":"p C/P","D":"(P/C)^p"},"answer":"A","explanation":"ISO bearing relation L10=(C/P)^p, p=3 ball, 10/3 roller.","difficulty":"Difficult","module":"Mechanics of Solids and Machine Design","topic":"Gears & Bearings","uid":"2026-11-01-69"},{"n":70,"question":"A helical compression spring of wire diameter d and mean coil diameter D has spring index","options":{"A":"d/D","B":"D+d","C":"D/d","D":"D-d"},"answer":"C","explanation":"Spring index C=D/d; affects curvature and stress correction.","difficulty":"Moderate","module":"Mechanics of Solids and Machine Design","topic":"Joints & Springs","uid":"2026-11-01-70"},{"n":71,"question":"In orthogonal cutting, chip thickness ratio is","options":{"A":"Chip thickness / uncut thickness","B":"Depth of cut / width","C":"Uncut thickness / chip thickness","D":"Cutting speed / feed"},"answer":"C","explanation":"Chip thickness ratio r=t1/t2, generally <1 in conventional cutting.","difficulty":"Easy","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-01-71"},{"n":72,"question":"Taylor tool-life equation is","options":{"A":"V T^n = C","B":"V/T^n=C","C":"V^n T=C","D":"V T=C^n"},"answer":"A","explanation":"Taylor law V T^n=C for fixed tool-work combination and conditions.","difficulty":"Difficult","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-01-72"},{"n":73,"question":"For a lathe, cutting speed for diameter D (mm) and spindle speed N (rpm) is","options":{"A":"D N/1000 m/min","B":"pi D/(1000 N) m/min","C":"pi D N/1000 m/min","D":"1000 pi D N m/min"},"answer":"C","explanation":"Peripheral speed=pi D N mm/min; divide by 1000 for m/min.","difficulty":"Moderate","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-01-73"},{"n":74,"question":"In conventional up milling, chip thickness generally","options":{"A":"Is always negative","B":"Decreases from maximum to zero","C":"Remains constant","D":"Increases from zero to maximum"},"answer":"D","explanation":"In up milling, cutter rotation opposes feed at contact; undeformed chip starts near zero and grows.","difficulty":"Moderate","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-01-74"},{"n":75,"question":"A casting riser is primarily provided to","options":{"A":"Remove all inclusions","B":"Increase mould permeability","C":"Compensate solidification shrinkage","D":"Reduce melting point"},"answer":"C","explanation":"Riser feeds liquid metal during freezing to avoid shrinkage cavities.","difficulty":"Difficult","module":"Manufacturing Technology","topic":"Casting & Forming","uid":"2026-11-01-75"},{"n":76,"question":"Chvorinov rule relates solidification time to","options":{"A":"Volume/surface area","B":"(Volume/surface area)^2","C":"Pouring temperature only","D":"Surface area/volume^2"},"answer":"B","explanation":"t_s=B(V/A)^n, n approximately 2 under common conditions.","difficulty":"Easy","module":"Manufacturing Technology","topic":"Casting & Forming","uid":"2026-11-01-76"},{"n":77,"question":"In welding, heat-affected zone is the region that","options":{"A":"Always melts completely","B":"Contains only filler metal","C":"Is unaffected base metal","D":"Does not melt but undergoes microstructural changes"},"answer":"D","explanation":"HAZ experiences thermal cycle sufficient to alter microstructure without fusion.","difficulty":"Moderate","module":"Manufacturing Technology","topic":"Welding & Joining","uid":"2026-11-01-77"},{"n":78,"question":"For resistance spot welding, heat generated is proportional to","options":{"A":"I R/t","B":"R/(I^2 t)","C":"I^2 R t","D":"I t/R"},"answer":"C","explanation":"Joule heat Q=I^2 R t; electrode force/contact conditions also matter.","difficulty":"Difficult","module":"Manufacturing Technology","topic":"Welding & Joining","uid":"2026-11-01-78"},{"n":79,"question":"In a rolling operation, maximum possible draft without front/back tension is approximately","options":{"A":"mu R","B":"mu^2/R","C":"R/mu","D":"mu^2 R"},"answer":"D","explanation":"Biting criterion tan(alpha)<=mu and small-angle geometry Delta h approx R alpha^2, hence Delta h_max approx mu^2 R.","difficulty":"Moderate","module":"Manufacturing Technology","topic":"Casting & Forming","uid":"2026-11-01-79"},{"n":80,"question":"True strain for uniform uniaxial tension from L0 to L is","options":{"A":"L/L0","B":"ln(L0/L)","C":"ln(L/L0)","D":"(L-L0)/L0"},"answer":"C","explanation":"Incremental true strain d epsilon=dL/L, integrate to ln(L/L0).","difficulty":"Moderate","module":"Manufacturing Technology","topic":"Casting & Forming","uid":"2026-11-01-80"},{"n":81,"question":"A 3D printer using thermoplastic filament extrusion is commonly called","options":{"A":"Electron beam melting","B":"Stereolithography","C":"Selective laser melting","D":"Fused deposition modelling"},"answer":"D","explanation":"FDM/FFF extrudes softened thermoplastic along programmed toolpaths.","difficulty":"Difficult","module":"Manufacturing Technology","topic":"Casting & Forming","uid":"2026-11-01-81"},{"n":82,"question":"EDM removes material primarily by","options":{"A":"Mechanical abrasion","B":"Electrochemical dissolution only","C":"Controlled electrical discharges","D":"Laser photons"},"answer":"C","explanation":"Electrical discharge machining erodes conductive workpieces by repeated sparks in dielectric. Kerala PSC AP Mechanical | Original practice mock | 01 Nov 2026 Page 7","difficulty":"Moderate","module":"Manufacturing Technology","topic":"Advanced Manufacturing & CNC","uid":"2026-11-01-82"},{"n":83,"question":"In powder metallurgy, sintering is performed mainly to","options":{"A":"Increase powder size before pressing","B":"Remove all porosity necessarily","C":"Completely vaporize particles","D":"Bond compacted particles by diffusion"},"answer":"D","explanation":"Sintering below bulk melting temperature develops necks and strengthens green compact.","difficulty":"Moderate","module":"Manufacturing Technology","topic":"Engineering Materials & Heat Treatment","uid":"2026-11-01-83"},{"n":84,"question":"For a hole-basis limits-and-fits system, the fundamental deviation of the basic hole is","options":{"A":"Upper deviation zero","B":"Tolerance zero","C":"Both deviations negative","D":"Lower deviation zero"},"answer":"D","explanation":"H hole lower deviation EI=0; tolerance extends above basic size.","difficulty":"Difficult","module":"Manufacturing Technology","topic":"Metrology","uid":"2026-11-01-84"},{"n":85,"question":"A surface roughness parameter Ra represents","options":{"A":"Arithmetic mean of absolute profile deviations","B":"Root mean square wavelength","C":"Number of asperities per mm","D":"Maximum peak-to-valley height"},"answer":"A","explanation":"Ra=(1/L) integral_0^L |z(x)| dx over evaluation length. VII. Industrial Engineering and Management","difficulty":"Moderate","module":"Manufacturing Technology","topic":"Metrology","uid":"2026-11-01-85"},{"n":86,"question":"In EOQ model with annual demand D, ordering cost S, and annual holding cost H/unit, EOQ is","options":{"A":"sqrt(DS/2H)","B":"sqrt(2DS/H)","C":"sqrt(DH/2S)","D":"2DS/H"},"answer":"B","explanation":"Minimize TC=DS/Q+HQ/2; derivative zero gives Q*=sqrt(2DS/H).","difficulty":"Easy","module":"Industrial Engineering and Management","topic":"PPC & Inventory","uid":"2026-11-01-86"},{"n":87,"question":"If annual demand is 800 units, order cost Rs 50, holding cost Rs 2/unit-year, EOQ is","options":{"A":"800 units","B":"400 units","C":"200 units","D":"100 units"},"answer":"C","explanation":"EOQ=sqrt(2DS/H)=sqrt(2*800*50/2)=sqrt(40000)=200.","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"PPC & Inventory","uid":"2026-11-01-87"},{"n":88,"question":"For an M/M/1 queue with arrival rate 4/hr and service rate 5/hr, utilization is","options":{"A":"0.8","B":"1.25","C":"4","D":"0.2"},"answer":"A","explanation":"rho=lambda/mu=4/5=0.8; stable since rho<1.","difficulty":"Difficult","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-01-88"},{"n":89,"question":"For the same M/M/1 queue (lambda=4/hr, mu=5/hr), mean number in system L is","options":{"A":"0.8","B":"5","C":"4","D":"1"},"answer":"C","explanation":"L=lambda/(mu-lambda)=4/(5-4)=4 customers.","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-01-89"},{"n":90,"question":"Little law for a stable queueing system is","options":{"A":"L=lambda/W","B":"L=lambda W","C":"W=L lambda","D":"L=W/lambda"},"answer":"B","explanation":"Long-run mean number in system L=throughput lambda times mean time W.","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-01-90"},{"n":91,"question":"In PERT, expected activity duration with optimistic a, most likely m, pessimistic b is","options":{"A":"(a+4m+b)/6","B":"(a+m+b)/3","C":"(a+2m+b)/4","D":"(4a+m+b)/6"},"answer":"A","explanation":"PERT beta approximation te=(a+4m+b)/6.","difficulty":"Difficult","module":"Industrial Engineering and Management","topic":"Network, Decision & Game Theory","uid":"2026-11-01-91"},{"n":92,"question":"In PERT, activity variance is","options":{"A":"(a+4m+b)/6","B":"(b+a)^2/6","C":"[(b-a)/6]^2","D":"(b-a)/6"},"answer":"C","explanation":"PERT approximate variance sigma^2=[(b-a)/6]^2.","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"Network, Decision & Game Theory","uid":"2026-11-01-92"},{"n":93,"question":"A project critical path is the path with","options":{"A":"Minimum total cost always","B":"Fewest activities","C":"Longest expected duration","D":"Largest float"},"answer":"C","explanation":"Critical path sets minimum project completion time; its activities have zero total float under standard CPM.","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"Network, Decision & Game Theory","uid":"2026-11-01-93"},{"n":94,"question":"In a linear programming maximization problem, a feasible optimal solution, when it exists, can be found at","options":{"A":"Only outside feasible region","B":"An extreme point of feasible polytope","C":"Only at its centroid","D":"Always at origin"},"answer":"B","explanation":"Fundamental LP theorem: if finite optimum exists on nonempty polyhedron, an extreme-point optimum exists (subject to lineality caveats). Kerala PSC AP Mechanical | Original practice mock | 01 Nov 2026 Page 8","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-01-94"},{"n":95,"question":"In an X-bar control chart with known sigma, 3-sigma limits for subgroup size n are","options":{"A":"mu +/- sigma/n","B":"mu +/- 3 n sigma","C":"mu +/- 3 sigma/sqrt(n)","D":"mu +/- 3 sigma"},"answer":"C","explanation":"Standard error of subgroup mean is sigma/sqrt(n); 3-sigma limits are mu +/- 3 sigma/sqrt(n).","difficulty":"Difficult","module":"Industrial Engineering and Management","topic":"Work Study & Quality","uid":"2026-11-01-95"},{"n":96,"question":"The process capability index Cp is","options":{"A":"(USL-LSL)/(3 sigma)","B":"6 sigma/(USL-LSL)","C":"(USL+LSL)/(6 sigma)","D":"(USL-LSL)/(6 sigma)"},"answer":"D","explanation":"Cp compares specification width with natural process spread 6 sigma; ignores centering.","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"Work Study & Quality","uid":"2026-11-01-96"},{"n":97,"question":"In ABC inventory analysis, A items are generally","options":{"A":"Low-value items","B":"Highest quantity items necessarily","C":"High annual consumption-value items","D":"Items with longest lead time only"},"answer":"C","explanation":"ABC ranks items by annual usage value (annual demand x unit cost).","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"PPC & Inventory","uid":"2026-11-01-97"},{"n":98,"question":"The break-even output Q for fixed cost F, selling price p and variable cost v per unit is","options":{"A":"F/(p+v)","B":"F/(p-v)","C":"F p/v","D":"(p-v)/F"},"answer":"B","explanation":"At break-even pQ=F+vQ, so Q=F/(p-v).","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"PPC & Inventory","uid":"2026-11-01-98"},{"n":99,"question":"A workstation produces 60 units in 8 hours with standard time 6 min/unit. Efficiency is","options":{"A":"80%","B":"75%","C":"60%","D":"100%"},"answer":"B","explanation":"Earned standard hours=60*6/60=6 h; efficiency=6/8=75%.","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"Work Study & Quality","uid":"2026-11-01-99"},{"n":100,"question":"In a transportation problem with m sources and n destinations, a nondegenerate basic feasible solution has","options":{"A":"m+n-1 occupied cells","B":"mn occupied cells","C":"min(m,n) occupied cells","D":"m+n occupied cells"},"answer":"A","explanation":"Rank of independent supply-demand constraints is m+n-1; nondegenerate BFS has that many basic allocations. Kerala PSC AP Mechanical | Original practice mock | 01 Nov 2026 Page 9","difficulty":"Moderate","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-01-100"}]},{"id":"2026-11-08","title":"Weekly Mock – 08 Nov 2026","questions":[{"n":1,"question":"Eigenvalues of A are 1, 2, 3. Find det(2A).","options":{"A":"12","B":"48","C":"6","D":"24"},"answer":"B","explanation":"det(2A)=2^3 det(A)=8(1x2x3)=48.","difficulty":"M","module":"Engineering Mathematics","topic":"Matrices","uid":"2026-11-08-1"},{"n":2,"question":"For f(x,y)=x^2+4y^2, the gradient at (1,-1) is","options":{"A":"(1,8)","B":"(2,-8)","C":"(1,-4)","D":"(2,8)"},"answer":"B","explanation":"grad f=(2x,8y); at (1,-1)=(2,-8).","difficulty":"E","module":"Engineering Mathematics","topic":"Vector Calculus","uid":"2026-11-08-2"},{"n":3,"question":"The Laplace transform of exp(-3t) sin(2t) is","options":{"A":"(s+3)/[(s+3)^2+4]","B":"2/(s^2+4)","C":"2/[(s+3)^2+4]","D":"1/(s+3)"},"answer":"C","explanation":"Use first shifting: L{e^-at sin bt}=b/[(s+a)^2+b^2].","difficulty":"M","module":"Engineering Mathematics","topic":"Ordinary Differential Equations","uid":"2026-11-08-3"},{"n":4,"question":"The integrating factor of dy/dx + (2/x)y=x^2, x>0, is","options":{"A":"1/x^2","B":"x","C":"exp(2x)","D":"x^2"},"answer":"D","explanation":"IF=exp(integral 2/x dx)=exp(2 ln x)=x^2.","difficulty":"E","module":"Engineering Mathematics","topic":"Ordinary Differential Equations","uid":"2026-11-08-4"},{"n":5,"question":"A random variable X has P(X=0)=1/4, P(X=2)=3/4. Its variance is","options":{"A":"3/4","B":"3/2","C":"9/4","D":"1"},"answer":"A","explanation":"E[X]=3/2; E[X^2]=3; Var=3-(3/2)^2=3/4.","difficulty":"M","module":"Engineering Mathematics","topic":"Probability & Statistics","uid":"2026-11-08-5"},{"n":6,"question":"For a 3x3 matrix with eigenvalues 2, -1, 4, trace(A inverse) equals","options":{"A":"-2","B":"5","C":"-1/4","D":"1/4"},"answer":"C","explanation":"trace(A^-1)=1/2-1+1/4=-1/4.","difficulty":"M","module":"Engineering Mathematics","topic":"Matrices","uid":"2026-11-08-6"},{"n":7,"question":"The residue of f(z)=1/[(z-1)(z-2)] at z=1 is","options":{"A":"-1","B":"1","C":"-2","D":"2"},"answer":"A","explanation":"Simple-pole residue=lim(z-1)f(z)=1/(1-2)=-1.","difficulty":"M","module":"Engineering Mathematics","topic":"Complex Analysis","uid":"2026-11-08-7"},{"n":8,"question":"Using Simpson 1/3 rule with h=1, approximate integral from 0 to 2 of x^2 dx.","options":{"A":"4","B":"3","C":"2","D":"8/3"},"answer":"D","explanation":"(h/3)[f(0)+4f(1)+f(2)]=(1/3)(0+4+4)=8/3.","difficulty":"E","module":"Engineering Mathematics","topic":"Numerical Methods","uid":"2026-11-08-8"},{"n":9,"question":"If y satisfies y double prime + 4y=0, y(0)=0 and y prime(0)=2, then y(pi/4) is","options":{"A":"1","B":"2","C":"sqrt(2)","D":"0"},"answer":"A","explanation":"y=A cos2x+B sin2x; A=0, 2B=2, B=1; sin(pi/2)=1.","difficulty":"D","module":"Engineering Mathematics","topic":"Ordinary Differential Equations","uid":"2026-11-08-9"},{"n":10,"question":"The directional derivative of f=x^2+y^2+z^2 at (1,2,2) along (2,1,2) is","options":{"A":"6","B":"16/3","C":"8","D":"14/3"},"answer":"B","explanation":"grad f=(2,4,4); unit direction=(2,1,2)/3; dot= (4+4+8)/3=16/3.","difficulty":"D","module":"Engineering Mathematics","topic":"Vector Calculus","uid":"2026-11-08-10"},{"n":11,"question":"For a Newtonian fluid, shear stress is proportional to","options":{"A":"fluid density","B":"pressure","C":"shear strain","D":"rate of shear strain"},"answer":"D","explanation":"Newton law of viscosity: tau=mu du/dy.","difficulty":"E","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Properties & Statics","uid":"2026-11-08-11"},{"n":12,"question":"For a two-dimensional incompressible flow, the continuity equation is","options":{"A":"u+v=0","B":"du/dy + dv/dx = 0","C":"du/dx - dv/dy = 0","D":"du/dx + dv/dy = 0"},"answer":"D","explanation":"Conservation of mass with constant density gives divergence of velocity zero.","difficulty":"E","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Kinematics & Dynamics","uid":"2026-11-08-12"},{"n":13,"question":"In a horizontal ideal venturi, velocity at throat doubles; the pressure change from inlet to throat is","options":{"A":"a decrease of rho V1^2/2","B":"an increase of 3 rho V1^2/2","C":"a decrease of 3 rho V1^2/2","D":"zero"},"answer":"C","explanation":"Bernoulli: p1-p2=rho(V2^2-V1^2)/2=3 rho V1^2/2.","difficulty":"M","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Kinematics & Dynamics","uid":"2026-11-08-13"},{"n":14,"question":"For fully developed laminar flow in a circular pipe, Darcy friction factor is","options":{"A":"0.3164/Re","B":"16/Re","C":"Re/64","D":"64/Re"},"answer":"D","explanation":"Hagen-Poiseuille combined with Darcy-Weisbach gives fD=64/Re.","difficulty":"E","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-08-14"},{"n":15,"question":"Water flows at 2 m/s through a pipe; velocity head for g=10 m/s^2 is","options":{"A":"0.1 m","B":"2 m","C":"0.4 m","D":"0.2 m"},"answer":"D","explanation":"V^2/(2g)=4/20=0.2 m.","difficulty":"E","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-08-15"},{"n":16,"question":"A model obeys Froude similarity with prototype/model length ratio 16. The velocity ratio is","options":{"A":"64","B":"2","C":"4","D":"16"},"answer":"C","explanation":"Fr=V/sqrt(gL); Vp/Vm=sqrt(16)=4.","difficulty":"M","module":"Fluid Mechanics and Hydraulic Machines","topic":"Dimensional Analysis & Similarity","uid":"2026-11-08-16"},{"n":17,"question":"In a free vortex, tangential velocity varies with radius as","options":{"A":"r^2","B":"r","C":"1/r","D":"constant"},"answer":"C","explanation":"For an ideal irrotational free vortex, v_theta r=constant.","difficulty":"M","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Kinematics & Dynamics","uid":"2026-11-08-17"},{"n":18,"question":"The theoretical maximum efficiency of an ideal impulse turbine depends on","options":{"A":"draft-tube length","B":"jet-to-bucket speed ratio","C":"suction head","D":"casing pressure"},"answer":"B","explanation":"Pelton impulse turbine transfers momentum; ideal power peaks at bucket speed approximately half jet speed.","difficulty":"M","module":"Fluid Mechanics and Hydraulic Machines","topic":"Hydraulic Turbines","uid":"2026-11-08-18"},{"n":19,"question":"A draft tube in a reaction turbine primarily","options":{"A":"prevents all cavitation","B":"increases jet velocity","C":"converts shaft power to water power","D":"converts exit kinetic head into pressure head"},"answer":"D","explanation":"Diffuser action recovers pressure from runner-exit kinetic energy.","difficulty":"E","module":"Fluid Mechanics and Hydraulic Machines","topic":"Hydraulic Turbines","uid":"2026-11-08-19"},{"n":20,"question":"For a rectangular channel with Froude number 2, the flow is","options":{"A":"critical","B":"subcritical","C":"always laminar","D":"supercritical"},"answer":"D","explanation":"Fr>1 indicates inertia-dominated supercritical open-channel flow.","difficulty":"E","module":"Fluid Mechanics and Hydraulic Machines","topic":"Open Channel Flow","uid":"2026-11-08-20"},{"n":21,"question":"For a horizontal pipe, L=50 m, D=0.1 m, V=2 m/s, fD=0.02, g=10, friction head loss is","options":{"A":"1 m","B":"2 m","C":"4 m","D":"10 m"},"answer":"B","explanation":"hf=fD(L/D)(V^2/2g)=0.02(500)(0.2)=2 m.","difficulty":"M","module":"Fluid Mechanics and Hydraulic Machines","topic":"Viscous & Pipe Flow","uid":"2026-11-08-21"},{"n":22,"question":"The displacement thickness for profile u/U=(y/delta)^2, 0<=y<=delta, is","options":{"A":"delta/2","B":"2delta/3","C":"delta/3","D":"delta/4"},"answer":"B","explanation":"delta*=integral[1-(y/delta)^2]dy=delta-delta/3=2delta/3.","difficulty":"D","module":"Fluid Mechanics and Hydraulic Machines","topic":"Boundary Layer","uid":"2026-11-08-22"},{"n":23,"question":"A pump at fixed impeller diameter increases speed by 20%. Ideal affinity-law head ratio H2/H1 is","options":{"A":"1.728","B":"1.44","C":"1.2","D":"1.04"},"answer":"B","explanation":"For dynamically similar pump operation H proportional N^2; 1.2^2=1.44.","difficulty":"M","module":"Fluid Mechanics and Hydraulic Machines","topic":"Pumps","uid":"2026-11-08-23"},{"n":24,"question":"For steady incompressible inviscid flow along a streamline, Bernoulli equation excludes","options":{"A":"elevation head","B":"viscous dissipation","C":"velocity head","D":"pressure head"},"answer":"B","explanation":"Ideal Bernoulli assumes no viscous losses or shaft work/heat effects.","difficulty":"D","module":"Fluid Mechanics and Hydraulic Machines","topic":"Fluid Kinematics & Dynamics","uid":"2026-11-08-24"},{"n":25,"question":"For a hydraulic jump in a rectangular channel with upstream Fr= sqrt(3), the sequent-depth ratio y2/y1 is","options":{"A":"2","B":"4","C":"sqrt(3)","D":"3"},"answer":"A","explanation":"y2/y1=[sqrt(1+8Fr1^2)-1]/2=[sqrt25-1]/2=2.","difficulty":"D","module":"Fluid Mechanics and Hydraulic Machines","topic":"Open Channel Flow","uid":"2026-11-08-25"},{"n":26,"question":"For an ideal gas, internal energy depends only on","options":{"A":"temperature","B":"entropy alone","C":"pressure alone","D":"volume alone"},"answer":"A","explanation":"Ideal-gas u=u(T).","difficulty":"E","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-08-26"},{"n":27,"question":"For a closed system undergoing a complete cycle, change in internal energy is","options":{"A":"equal to heat input","B":"always positive","C":"equal to work input","D":"zero"},"answer":"D","explanation":"Internal energy is a state function; cyclic change is zero.","difficulty":"E","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-08-27"},{"n":28,"question":"A reversible Carnot engine works between 600 K and 300 K. Its efficiency is","options":{"A":"100%","B":"75%","C":"25%","D":"50%"},"answer":"D","explanation":"eta=1-Tc/Th=1-300/600=0.5.","difficulty":"E","module":"Thermodynamics and Heat Transfer","topic":"Second Law & Entropy","uid":"2026-11-08-28"},{"n":29,"question":"The isentropic relation for ideal gas with constant gamma is","options":{"A":"p v^gamma = constant","B":"p v = constant","C":"p v^2 = constant for all gases","D":"p/T = constant"},"answer":"A","explanation":"Reversible adiabatic ideal gas: pv^gamma=constant.","difficulty":"M","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-08-29"},{"n":30,"question":"A heat pump has COP=4 and consumes 2 kW. Heat delivered is","options":{"A":"2 kW","B":"0.5 kW","C":"8 kW","D":"6 kW"},"answer":"C","explanation":"COP_HP=QH/W; QH=4x2=8 kW.","difficulty":"E","module":"Thermodynamics and Heat Transfer","topic":"Refrigeration & Psychrometry","uid":"2026-11-08-30"},{"n":31,"question":"In a steady-flow nozzle with negligible heat/work and elevation changes, enthalpy drop equals","options":{"A":"mass flow rate","B":"increase in kinetic energy per unit mass","C":"pressure rise","D":"decrease in entropy"},"answer":"B","explanation":"SFEE: h1+V1^2/2=h2+V2^2/2.","difficulty":"M","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-08-31"},{"n":32,"question":"For plane wall k=2 W/mK, thickness 0.1 m, area 1 m^2, delta T=20 K, heat rate is","options":{"A":"200 W","B":"800 W","C":"400 W","D":"40 W"},"answer":"C","explanation":"Q=k A deltaT/L=2x1x20/0.1=400 W.","difficulty":"E","module":"Thermodynamics and Heat Transfer","topic":"Conduction","uid":"2026-11-08-32"},{"n":33,"question":"The Biot number compares","options":{"A":"thermal diffusivity to momentum diffusivity","B":"inertia to viscosity","C":"convection to radiation","D":"internal conduction resistance to surface convection resistance"},"answer":"D","explanation":"Bi=h Lc/k=R_cond/R_conv for suitable characteristic length.","difficulty":"M","module":"Thermodynamics and Heat Transfer","topic":"Conduction","uid":"2026-11-08-33"},{"n":34,"question":"For a blackbody, total emissive power varies with absolute temperature as","options":{"A":"T^2","B":"1/T","C":"T","D":"T^4"},"answer":"D","explanation":"Stefan-Boltzmann: Eb=sigma T^4.","difficulty":"E","module":"Thermodynamics and Heat Transfer","topic":"Radiation & Mass Transfer","uid":"2026-11-08-34"},{"n":35,"question":"The effectiveness of a heat exchanger is defined as","options":{"A":"outlet temperature / inlet temperature","B":"NTU / capacity ratio","C":"heat loss / heat input","D":"actual heat transfer / maximum possible heat transfer"},"answer":"D","explanation":"epsilon=Q/Qmax, Qmax=Cmin(Th,in-Tc,in).","difficulty":"M","module":"Thermodynamics and Heat Transfer","topic":"Convection & Heat Exchangers","uid":"2026-11-08-35"},{"n":36,"question":"A counterflow exchanger has Cmin=2 kW/K and inlet temperature difference 40 K. Maximum possible heat transfer is","options":{"A":"160 kW","B":"20 kW","C":"80 kW","D":"40 kW"},"answer":"C","explanation":"Qmax=Cmin deltaTin=2x40=80 kW.","difficulty":"M","module":"Thermodynamics and Heat Transfer","topic":"Convection & Heat Exchangers","uid":"2026-11-08-36"},{"n":37,"question":"The critical insulation radius of a cylinder with k=0.05 W/mK and h=10 W/m^2K is","options":{"A":"0.05 m","B":"0.5 m","C":"0.005 m","D":"0.0005 m"},"answer":"C","explanation":"rcrit=k/h=0.05/10=0.005 m.","difficulty":"D","module":"Thermodynamics and Heat Transfer","topic":"Conduction","uid":"2026-11-08-37"},{"n":38,"question":"For one-dimensional steady conduction with uniform positive volumetric heat generation in a plane wall, the temperature profile is","options":{"A":"linear","B":"exponential","C":"parabolic","D":"sinusoidal"},"answer":"C","explanation":"d^2T/dx^2=-qgen/k, so T is quadratic.","difficulty":"D","module":"Thermodynamics and Heat Transfer","topic":"Conduction","uid":"2026-11-08-38"},{"n":39,"question":"For ideal gas air with gamma=1.4, isentropic compression from T1=300 K at pressure ratio 32, approximate T2 is (32^(2/7) about 2.69)","options":{"A":"430 K","B":"600 K","C":"960 K","D":"807 K"},"answer":"D","explanation":"T2/T1=(p2/p1)^((gamma-1)/gamma)=32^(2/7) approx 2.69; T2 approx 807 K.","difficulty":"D","module":"Thermodynamics and Heat Transfer","topic":"Thermodynamic Fundamentals","uid":"2026-11-08-39"},{"n":40,"question":"In a radiation network for two large parallel gray plates, emissivity 0.5 each, effective denominator 1/e1+1/e2-1 equals","options":{"A":"1","B":"2","C":"4","D":"3"},"answer":"D","explanation":"Net q/A=sigma(T1^4-T2^4)/(1/e1+1/e2-1); 2+2-1=3.","difficulty":"D","module":"Thermodynamics and Heat Transfer","topic":"Radiation & Mass Transfer","uid":"2026-11-08-40"},{"n":41,"question":"A body is in planar static equilibrium when","options":{"A":"velocity=0 always","B":"sum Fx=0, sum Fy=0, sum M=0","C":"only sum Fx=0","D":"only sum M=0"},"answer":"B","explanation":"Three independent equilibrium equations apply to planar rigid bodies.","difficulty":"E","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-08-41"},{"n":42,"question":"For a simply supported beam with a central point load P, each reaction is","options":{"A":"2P","B":"P","C":"P/4","D":"P/2"},"answer":"D","explanation":"Symmetry and sum vertical forces imply equal reactions P/2.","difficulty":"E","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-08-42"},{"n":43,"question":"A block on a rough horizontal plane has limiting friction 30 N and normal reaction 100 N. Coefficient of friction is","options":{"A":"0.7","B":"0.3","C":"3","D":"0.03"},"answer":"B","explanation":"mu=F_lim/N=30/100=0.3.","difficulty":"E","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-08-43"},{"n":44,"question":"The instantaneous centre of a wheel rolling without slip on a fixed horizontal surface is","options":{"A":"infinity","B":"wheel centre","C":"point of contact","D":"top of wheel"},"answer":"C","explanation":"Contact point has zero instantaneous velocity in pure rolling.","difficulty":"M","module":"Applied Mechanics and Theory of Machines","topic":"Mechanisms","uid":"2026-11-08-44"},{"n":45,"question":"For a slider-crank with crank radius r and connecting rod l, ratio l/r is commonly called","options":{"A":"crank ratio r/l","B":"velocity ratio","C":"connecting-rod ratio","D":"gear ratio"},"answer":"C","explanation":"In slider-crank kinematics l/r denotes connecting rod to crank length ratio.","difficulty":"M","module":"Applied Mechanics and Theory of Machines","topic":"Mechanisms","uid":"2026-11-08-45"},{"n":46,"question":"A flywheel primarily reduces","options":{"A":"mean power demand","B":"bearing friction to zero","C":"total work per cycle","D":"cyclic speed fluctuation"},"answer":"D","explanation":"Flywheel stores/releases kinetic energy to smooth speed variation.","difficulty":"E","module":"Applied Mechanics and Theory of Machines","topic":"Flywheel, Gyroscope & Balancing","uid":"2026-11-08-46"},{"n":47,"question":"For a simple pendulum of length 1 m, g=pi^2 m/s^2, small-oscillation period is","options":{"A":"2 s","B":"4 s","C":"1 s","D":"pi s"},"answer":"A","explanation":"T=2pi sqrt(l/g)=2pi/pi=2 s.","difficulty":"M","module":"Applied Mechanics and Theory of Machines","topic":"Vibrations","uid":"2026-11-08-47"},{"n":48,"question":"A gear train with driver 20 teeth and driven 60 teeth has speed ratio Ndriver/Ndriven of","options":{"A":"6","B":"1/3","C":"2","D":"3"},"answer":"D","explanation":"Gear mesh: N1 Z1=N2 Z2; N1/N2=Z2/Z1=60/20=3.","difficulty":"M","module":"Applied Mechanics and Theory of Machines","topic":"Cams & Gears","uid":"2026-11-08-48"},{"n":49,"question":"A uniform slender rod of length L pivoted at one end has mass moment of inertia about pivot","options":{"A":"mL^2/2","B":"mL^2","C":"mL^2/12","D":"mL^2/3"},"answer":"D","explanation":"Parallel-axis theorem: Iend=Icm+m(L/2)^2=mL^2/12+mL^2/4=mL^2/3.","difficulty":"M","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-08-49"},{"n":50,"question":"For a four-bar planar mechanism, Grashof criterion for at least one link to make full revolution is","options":{"A":"p=q always","B":"s=l always","C":"s+l > p+q","D":"s+l <= p+q"},"answer":"D","explanation":"Shortest plus longest no greater than sum of other two is Grashof condition.","difficulty":"M","module":"Applied Mechanics and Theory of Machines","topic":"Mechanisms","uid":"2026-11-08-50"},{"n":51,"question":"The Coriolis acceleration magnitude for a slider moving radially at speed vr on a link rotating at omega is","options":{"A":"2 omega vr","B":"omega vr","C":"omega^2 r","D":"vr^2/r"},"answer":"A","explanation":"Coriolis component in rotating frame ac=2 omega cross vr; magnitude 2 omega vr.","difficulty":"D","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-08-51"},{"n":52,"question":"In a single-degree-of-freedom undamped oscillator, doubling stiffness at fixed mass changes natural frequency by","options":{"A":"4","B":"1/2","C":"sqrt(2)","D":"2"},"answer":"C","explanation":"omega_n=sqrt(k/m), hence ratio sqrt2.","difficulty":"M","module":"Applied Mechanics and Theory of Machines","topic":"Vibrations","uid":"2026-11-08-52"},{"n":53,"question":"For a disc rotating with angular speed omega and angular acceleration alpha, tangential acceleration at radius r is","options":{"A":"alpha r","B":"omega r","C":"alpha/r","D":"omega^2 r"},"answer":"A","explanation":"Tangential acceleration=alpha r; normal acceleration=omega^2 r.","difficulty":"D","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-08-53"},{"n":54,"question":"For a cam-follower SHM rise of height h over cam angle beta, maximum acceleration magnitude at constant cam omega is","options":{"A":"2h omega^2/beta^2","B":"h omega^2/beta","C":"h pi^2 omega^2/(2 beta^2)","D":"h pi omega^2/beta"},"answer":"C","explanation":"SHM displacement y=(h/2)(1-cos(pi theta/beta)); differentiate twice in time: |amax|=h pi^2 omega^2/(2 beta^2).","difficulty":"D","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-08-54"},{"n":55,"question":"For a rotor with unbalance mass m at eccentricity e rotating at omega, centrifugal unbalance force magnitude is","options":{"A":"m e^2 omega","B":"m omega^2/e","C":"m e omega","D":"m e omega^2"},"answer":"D","explanation":"Centripetal force magnitude=m omega^2 e, rotating in direction with shaft.","difficulty":"D","module":"Applied Mechanics and Theory of Machines","topic":"Statics & Dynamics","uid":"2026-11-08-55"},{"n":56,"question":"Normal stress is defined as","options":{"A":"normal force divided by area","B":"strain times length","C":"moment per unit volume","D":"shear force times area"},"answer":"A","explanation":"sigma=P/A for axial load on uniform cross-section.","difficulty":"E","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-56"},{"n":57,"question":"Young modulus is the ratio of","options":{"A":"normal stress to longitudinal strain","B":"shear stress to shear strain","C":"lateral strain to axial strain","D":"bulk stress to volume"},"answer":"A","explanation":"E=sigma/epsilon in linear elastic uniaxial loading.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-57"},{"n":58,"question":"For a solid circular shaft in torsion, maximum shear stress varies with diameter at fixed torque as","options":{"A":"1/d^2","B":"d^3","C":"1/d^3","D":"1/d"},"answer":"C","explanation":"tau_max=16T/(pi d^3).","difficulty":"M","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-58"},{"n":59,"question":"For a simply supported beam with central load P and span L, maximum bending moment is","options":{"A":"PL/2","B":"PL","C":"PL/8","D":"PL/4"},"answer":"D","explanation":"Reaction P/2, maximum moment at midspan=(P/2)(L/2)=PL/4.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-59"},{"n":60,"question":"The strain energy in an axially loaded linear-elastic bar is","options":{"A":"PL/(AE)","B":"P^2/(AE)","C":"PL^2/(2AE)","D":"P^2 L/(2AE)"},"answer":"D","explanation":"U=1/2 P delta; delta=PL/(AE); U=P^2L/(2AE).","difficulty":"M","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-60"},{"n":61,"question":"For plane stress sigma_x=100 MPa, sigma_y=0, tau_xy=0, maximum in-plane shear stress is","options":{"A":"25 MPa","B":"0 MPa","C":"50 MPa","D":"100 MPa"},"answer":"C","explanation":"Mohr circle radius=(sigma1-sigma2)/2=50 MPa.","difficulty":"M","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-61"},{"n":62,"question":"The Euler critical load of a pin-ended column is","options":{"A":"2pi EI/L","B":"pi EI/L^2","C":"pi^2 EI/L^2","D":"4pi^2 EI/L^2"},"answer":"C","explanation":"Pcr=pi^2 EI/(Le)^2, Le=L for pinned-pinned.","difficulty":"M","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-62"},{"n":63,"question":"For a thin-walled cylinder, hoop stress is","options":{"A":"pD/(2t)","B":"2pt/D","C":"pD/t","D":"pD/(4t)"},"answer":"A","explanation":"Equilibrium of longitudinal split gives sigma_h=pD/(2t).","difficulty":"M","module":"Mechanics of Solids and Machine Design","topic":"Belts & Pressure Vessels","uid":"2026-11-08-63"},{"n":64,"question":"A bar has E=200 GPa and axial strain 0.001. Stress is","options":{"A":"2 MPa","B":"2000 MPa","C":"20 MPa","D":"200 MPa"},"answer":"D","explanation":"sigma=E epsilon=200000 MPa x0.001=200 MPa.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-64"},{"n":65,"question":"For fatigue design, the Goodman line relates alternating stress and mean stress using","options":{"A":"bulk modulus and Poisson ratio","B":"endurance limit and ultimate tensile strength","C":"fracture toughness only","D":"yield strength only"},"answer":"B","explanation":"Modified Goodman: sigma_a/Se + sigma_m/Sut=1 for failure boundary.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Material Properties & Failure","uid":"2026-11-08-65"},{"n":66,"question":"In a close-coiled helical spring, deflection under axial load W is","options":{"A":"8 W D^2 n/(G d^3)","B":"8 W D^3 n/(G d^4)","C":"8 W D n/(G d^2)","D":"W D^3/(E d^4)"},"answer":"B","explanation":"Spring deflection delta=8WD^3n/(Gd^4), D mean coil diameter.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-66"},{"n":67,"question":"A shaft has bending moment M and torque T. Maximum shear stress theory equivalent torque is","options":{"A":"sqrt(M^2-T^2)","B":"M+T","C":"sqrt(M^2+T^2)","D":"M^2+T^2"},"answer":"C","explanation":"For circular shaft, Tresca equivalent torque Te=sqrt(M^2+T^2), no shock factors.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Stress, Strain & Beams","uid":"2026-11-08-67"},{"n":68,"question":"For an interference fit, the shaft diameter is","options":{"A":"larger than hole diameter before assembly","B":"smaller than hole diameter","C":"always equal to hole diameter","D":"unrelated to hole size"},"answer":"A","explanation":"Interference fit requires positive interference before assembly.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Shafts, Clutches & Brakes","uid":"2026-11-08-68"},{"n":69,"question":"For a riveted joint, pitch p=50 mm and hole diameter d=10 mm, tearing efficiency for one hole per pitch is","options":{"A":"20%","B":"90%","C":"80%","D":"60%"},"answer":"C","explanation":"Tearing efficiency=(p-d)/p=(50-10)/50=0.8.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Joints & Springs","uid":"2026-11-08-69"},{"n":70,"question":"For a circular shaft with torque doubled and diameter increased by factor 2, max shear stress ratio new/old is","options":{"A":"1/8","B":"1/4","C":"2","D":"1/2"},"answer":"B","explanation":"tau proportional T/d^3; ratio=2/2^3=1/4.","difficulty":"D","module":"Mechanics of Solids and Machine Design","topic":"Shafts, Clutches & Brakes","uid":"2026-11-08-70"},{"n":71,"question":"The primary function of a riser in casting is to","options":{"A":"increase casting speed","B":"vent only gases","C":"remove moulding sand","D":"feed liquid metal during solidification shrinkage"},"answer":"D","explanation":"Riser supplies molten metal to compensate for shrinkage.","difficulty":"D","module":"Manufacturing Technology","topic":"Casting & Forming","uid":"2026-11-08-71"},{"n":72,"question":"In orthogonal cutting, the cutting edge is","options":{"A":"parallel to cutting velocity","B":"always helical","C":"inclined 45 degrees to velocity","D":"perpendicular to cutting velocity"},"answer":"D","explanation":"Orthogonal machining assumes cutting edge normal to cutting direction.","difficulty":"M","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-08-72"},{"n":73,"question":"The purpose of a cutting fluid includes","options":{"A":"cooling and lubrication","B":"increasing tool wear","C":"increasing friction","D":"eliminating chips"},"answer":"A","explanation":"Cutting fluid can reduce heat and friction and aid chip removal.","difficulty":"M","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-08-73"},{"n":74,"question":"For Taylor tool-life law V T^n=C, doubling cutting speed changes tool life by factor","options":{"A":"2","B":"2^n","C":"2^(-1/n)","D":"2^(-n)"},"answer":"C","explanation":"T=(C/V)^(1/n); T2/T1=(V1/V2)^(1/n)=2^(-1/n).","difficulty":"M","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-08-74"},{"n":75,"question":"In up milling, undeformed chip thickness generally","options":{"A":"decreases from maximum to zero","B":"increases from zero to maximum","C":"stays constant","D":"is always zero"},"answer":"B","explanation":"Conventional/up milling begins at near-zero chip thickness and increases.","difficulty":"M","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-08-75"},{"n":76,"question":"For a single-point turning operation, material removal rate is approximately","options":{"A":"pi D N f d","B":"N f/d","C":"pi D^2 N/4","D":"pi D N/(f d)"},"answer":"A","explanation":"MRR=cutting speed x feed x depth =pi D N f d, consistent units.","difficulty":"M","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-08-76"},{"n":77,"question":"A 100 mm diameter workpiece rotates at 300 rpm. Cutting speed in m/min is approximately","options":{"A":"942","B":"94.2","C":"31.4","D":"9.42"},"answer":"B","explanation":"V=pi D N/1000=pi(100)(300)/1000=30pi=94.2 m/min.","difficulty":"M","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-08-77"},{"n":78,"question":"The heat source in resistance spot welding is primarily","options":{"A":"chemical flame","B":"electron beam","C":"friction alone","D":"I^2 R t heating"},"answer":"D","explanation":"Joule heating Q=I^2Rt at electrical resistance regions.","difficulty":"M","module":"Manufacturing Technology","topic":"Welding & Joining","uid":"2026-11-08-78"},{"n":79,"question":"The purpose of a jig, unlike a fixture, is to","options":{"A":"only hold workpiece","B":"measure surface roughness","C":"guide the cutting tool","D":"control spindle speed"},"answer":"C","explanation":"Jig holds/locates work and guides tool; fixture holds/locates only.","difficulty":"M","module":"Manufacturing Technology","topic":"Metrology","uid":"2026-11-08-79"},{"n":80,"question":"The main advantage of powder metallurgy for porous self-lubricating bearings is","options":{"A":"only single-phase microstructure","B":"absence of all pores","C":"controlled interconnected porosity","D":"no sintering needed"},"answer":"C","explanation":"PM allows engineered pores to retain lubricating oil.","difficulty":"M","module":"Manufacturing Technology","topic":"Engineering Materials & Heat Treatment","uid":"2026-11-08-80"},{"n":81,"question":"In a single-pass rolling process, volume constancy approximately implies","options":{"A":"roll speed zero","B":"thickness alone constant","C":"friction zero","D":"width x thickness x length is constant"},"answer":"D","explanation":"Plastic incompressibility gives b h L approximately constant.","difficulty":"M","module":"Manufacturing Technology","topic":"Casting & Forming","uid":"2026-11-08-81"},{"n":82,"question":"In EDM, material removal occurs primarily by","options":{"A":"electrical spark erosion","B":"plastic shearing by tool","C":"abrasive grains","D":"chemical etching alone"},"answer":"A","explanation":"Pulsed discharges melt/vaporize material; workpiece must be electrically conductive.","difficulty":"M","module":"Manufacturing Technology","topic":"Advanced Manufacturing & CNC","uid":"2026-11-08-82"},{"n":83,"question":"In a 3-2-1 locating scheme for a rigid prismatic workpiece, the 3 primary locators constrain","options":{"A":"three degrees of freedom","B":"two degrees","C":"one degree","D":"six degrees"},"answer":"A","explanation":"Three points on primary plane arrest translation normal to plane and rotations about its two in-plane axes.","difficulty":"D","module":"Manufacturing Technology","topic":"Metrology","uid":"2026-11-08-83"},{"n":84,"question":"For orthogonal cutting with rake angle 0 degrees and chip thickness ratio r=0.5, shear angle is approximately","options":{"A":"45 degrees","B":"14 degrees","C":"26.6 degrees","D":"63.4 degrees"},"answer":"C","explanation":"tan phi=r cos alpha/(1-r sin alpha)=0.5; phi=arctan0.5 approx 26.6 degrees.","difficulty":"D","module":"Manufacturing Technology","topic":"Machine Tools & Finishing","uid":"2026-11-08-84"},{"n":85,"question":"A CNC axis uses lead screw pitch 5 mm/rev and 200 full steps/rev motor without gearing. Linear movement per step is","options":{"A":"0.25 mm","B":"0.025 mm","C":"1 mm","D":"0.005 mm"},"answer":"B","explanation":"Movement/step=5/200=0.025 mm.","difficulty":"D","module":"Manufacturing Technology","topic":"Advanced Manufacturing & CNC","uid":"2026-11-08-85"},{"n":86,"question":"Economic order quantity balances","options":{"A":"selling price and tax","B":"ordering and holding costs","C":"wages and depreciation","D":"fixed and variable overhead only"},"answer":"B","explanation":"EOQ=sqrt(2DS/H) minimizes annual ordering plus inventory carrying cost.","difficulty":"M","module":"Industrial Engineering and Management","topic":"PPC & Inventory","uid":"2026-11-08-86"},{"n":87,"question":"In PERT, expected activity duration is","options":{"A":"(4a+m+b)/6","B":"(a+m+b)/3","C":"(a+b)/2","D":"(a+4m+b)/6"},"answer":"D","explanation":"PERT beta approximation te=(optimistic+4 most likely+pessimistic)/6.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Network, Decision & Game Theory","uid":"2026-11-08-87"},{"n":88,"question":"For a process with mean 50 and standard deviation 2, Cp with USL=56 and LSL=44 is","options":{"A":"1","B":"2","C":"1.5","D":"0.5"},"answer":"A","explanation":"Cp=(USL-LSL)/(6sigma)=12/12=1.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Work Study & Quality","uid":"2026-11-08-88"},{"n":89,"question":"The critical path in a project network is the path with","options":{"A":"largest cost necessarily","B":"longest total duration","C":"fewest activities","D":"most workers"},"answer":"B","explanation":"Critical path determines minimum project completion time absent resource constraints.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Network, Decision & Game Theory","uid":"2026-11-08-89"},{"n":90,"question":"In a transportation problem with m sources and n destinations, a nondegenerate basic feasible solution has","options":{"A":"m+n basic allocations","B":"m-n basic allocations","C":"m n basic allocations","D":"m+n-1 basic allocations"},"answer":"D","explanation":"Transportation BFS contains m+n-1 independent basic variables.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-08-90"},{"n":91,"question":"Little law for a stable system relates average number L, arrival rate lambda and average time W as","options":{"A":"L=W/lambda","B":"L=lambda W","C":"L=lambda/W","D":"W=lambda L"},"answer":"B","explanation":"Conservation of flow yields average work in process L=lambda W.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-08-91"},{"n":92,"question":"Demand is 10000 units/year, ordering cost Rs 200/order, holding cost Rs 4/unit-year. EOQ is","options":{"A":"1000 units","B":"200 units","C":"500 units","D":"2000 units"},"answer":"A","explanation":"EOQ=sqrt(2DS/H)=sqrt(2x10000x200/4)=sqrt(1,000,000)=1000.","difficulty":"M","module":"Industrial Engineering and Management","topic":"PPC & Inventory","uid":"2026-11-08-92"},{"n":93,"question":"The slope of an operating characteristic curve in acceptance sampling mainly concerns","options":{"A":"machining speed versus feed","B":"inventory versus time","C":"probability of acceptance versus lot fraction defective","D":"profit versus sales"},"answer":"C","explanation":"OC curve plots P(accept lot) against incoming defect fraction.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Work Study & Quality","uid":"2026-11-08-93"},{"n":94,"question":"A control chart with sample averages is commonly used to
