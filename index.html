 monitor","options":{"A":"individual defect types only","B":"process location/mean","C":"inventory reorder point","D":"project completion probability"},"answer":"B","explanation":"X-bar chart tracks subgroup average and process mean.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Work Study & Quality","uid":"2026-11-08-94"},{"n":95,"question":"For a single-server M/M/1 queue with arrival rate 3/h and service rate 5/h, utilization is","options":{"A":"1.67","B":"0.4","C":"0.6","D":"0.2"},"answer":"C","explanation":"rho=lambda/mu=3/5=0.6; stability requires rho<1.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-08-95"},{"n":96,"question":"If a machine has availability 0.9, performance 0.8, quality 0.95, its OEE is","options":{"A":"68.4%","B":"95%","C":"72%","D":"85.5%"},"answer":"A","explanation":"OEE=A x P x Q=0.9x0.8x0.95=0.684.","difficulty":"D","module":"Industrial Engineering and Management","topic":"Work Study & Quality","uid":"2026-11-08-96"},{"n":97,"question":"In linear programming, if a feasible solution lies at intersection of active constraints, it is a","options":{"A":"unique global maximum always","B":"basic feasible solution","C":"necessarily infeasible point","D":"nonlinear optimum"},"answer":"B","explanation":"For standard-form LP, a basic feasible solution corresponds to a feasible basis/extreme point, allowing","difficulty":"D","module":"Industrial Engineering and Management","topic":"Operations Research","uid":"2026-11-08-97"},{"n":98,"question":"A PERT activity has a=2, m=5, b=8 days. Its variance is","options":{"A":"6 day^2","B":"5 day^2","C":"2 day^2","D":"1 day^2"},"answer":"D","explanation":"Variance=[(b-a)/6]^2=[6/6]^2=1 day^2.","difficulty":"M","module":"Industrial Engineering and Management","topic":"Network, Decision & Game Theory","uid":"2026-11-08-98"},{"n":99,"question":"For a series system of three independent components each reliability 0.9, sy function finish(){if(!session)return;clearInterval(tick);seconds=Math.floor((Date.now()-start)/1000);let qs=session.qs,c=qs.filter(q=>selected[q.uid]===q.answer).length,w=qs.filter(q=>selected[q.uid]&&selected[q.uid]!==q.answer).length,skip=qs.length-c-w,score=c-w/3;lastSession={qs:session.qs,title:session.title,mode:session.mode,limit:session.limit,answers:{...selected}};let record={title:session.title,ids:qs.map(q=>q.uid),date:new Date().toLocaleString(),correct:c,wrong:w,skipped:skip,score,total:qs.length,seconds};let h=history();h.push(record);save(h);$('test').classList.add('hidden');$('results').classList.remove('hidden');$('results').innerHTML=`<h2>Test completed</h2><div class="grid"><div class="stat">Score <b>${score.toFixed(2)} / ${qs.length}</b></div><div class="stat">Correct <b>${c}</b></div><div class="stat">Wrong <b>${w}</b></div><div class="stat">Skipped <b>${skip}</b></div></div><p class="muted">Time: ${seconds}s • Negative marking: −1/3</p><button onclick="begin(lastSession.qs,lastSession.title,lastSession.mode,lastSession.limit)">Reattempt</button><button class="secondary" onclick="begin(lastSession.qs.filter(q=>lastSession.answers[q.uid]!==q.answer),'Wrong / Skipped Revision','practice',0)" ${w+skip===0?'disabled':''}>Wrong / Skipped Revision</button><button class="secondary" onclick="screen('weekly')">Weekly mocks</button><button class="secondary" onclick="screen('topic')">Topics</button><div class="line"></div><h3>Answer review</h3>`+qs.map((q,i)=>`<details class="stat" style="margin:8px 0"><summary>Q${i+1}. ${esc(q.question)} ${selected[q.uid]===q.answer?'✓':'✗'}</summary><p>Your answer: ${esc(selected[q.uid]||'Skipped')} • Correct: ${esc(q.answer)}</p><div class="exp"><b>Explanation (Malayalam support):</b> ${esc(NOTES[q.uid]?.detailed||'Pending preparation')}<p><b>Original:</b> ${esc(q.explanation||'No explanation available')}</p><b>PSC Shortcut:</b> ${esc(NOTES[q.uid]?.shortcut||'Pending review')}<p><b>Exam Trap:</b> ${esc(NOTES[q.uid]?.trap||'Pending review')}</p></div></details>`).join('');session=null}
function exportHistory(){let b=new Blob([JSON.stringify(history(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mission-psc-attempt-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importHistory(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data)||!data.every(x=>Array.isArray(x.ids)&&typeof x.title==='string'))throw Error('Invalid history');save(history().concat(data));renderHome();alert('History imported')}catch(err){alert('Invalid history file')}};r.readAsText(f)}screen('topic');</script><script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
